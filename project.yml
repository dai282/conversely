name: Conversely

options:
  bundleIdPrefix: com.dainguyen.conversely
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  Conversely:
    type: application
    platform: iOS
    deploymentTarget: "17.4"
    sources:
      - path: Conversely
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: "Conversely needs microphone access to hear what you say so it can transcribe and translate it."
        NSSpeechRecognitionUsageDescription: "Conversely uses on-device speech recognition to transcribe what you say before translating it. Nothing is sent off your device."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dainguyen.conversely
        PRODUCT_NAME: Conversely
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        ENABLE_PREVIEWS: "YES"
